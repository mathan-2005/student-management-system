<!DOCTYPE html>
<html>

<head>

    <title>Student App</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: lightblue;
            padding: 20px;
        }

        h1{
            text-align: center;
            color: black;
            font-size: 40px;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        h2{
            text-align: center;

            font-size: 30px;
            padding: 5px;
            margin-bottom: 0px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .form-container{
            background: burlywood;
            padding: 20px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        input{
            width: 95%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid black;
        }

        select{
            width: 101%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid black;
            
        }

        #searchInput{
            width: 200px;
            display: block;
            margin: 20px auto;
            text-align:center;
        }

       .add-btn{

    background-color: black;

    color: white;

    width: 200px;

    padding: 10px;

    border: none;

    border-radius: 9px;

    cursor: pointer;

    display: block;

    margin: 20px auto;
}


    

        .save-btn{
    background-color: blue;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 5px;
    cursor: pointer;
}

        .student-card{
            background: white;
            width: 70%;
            margin: 10px auto;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 0px 5px rgba(0,0,0,0.2);

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn{
            background-color: red;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .update-btn{
            background-color: green;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }

        #messageBox{
            width: 300px;
            margin: 5px auto;
            padding: 5px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            color: white;
        }
        .top-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#1e3a8a;

    padding:15px 30px;

    border-radius:15px;

    box-shadow:0px 4px 15px rgba(0,0,0,0.2);

    margin-bottom:30px;
}

.logo-area{

    display:flex;

    align-items:center;

    gap:15px;
}

.logo-area img{

    width:70px;

    height:70px;

    border-radius:50%;

    background:white;

    padding:8px;
}

.logo-area h1{

    margin:0;

    color:white;

    font-size:32px;
}

.logo-area p{

    margin:3px 0 0 0;

    color:#dbeafe;

    font-size:15px;
}

.logout-btn{

    background:white;

    color:#1e3a8a;

    border:none;

    padding:10px 18px;

    border-radius:8px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.logout-btn:hover{

    transform:scale(1.05);

    background:#dbeafe;
}
.file-section{

    width:70%;

    margin:40px auto;

    background:white;

    padding:25px;

    border-radius:15px;

    text-align:center;

    box-shadow:0px 4px 15px rgba(0,0,0,0.15);
}

.file-section h2{

    margin-bottom:25px;

    color:#1e3a8a;
}

.button-group{

    display:flex;

    justify-content:center;

    gap:20px;

    margin-bottom:25px;
}

.export-btn,
.pdf-btn,
.import-btn{

    border:none;

    padding:12px 20px;

    border-radius:10px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.export-btn{

    background:#16a34a;

    color:white;
}

.export-btn:hover{

    background:#15803d;

    transform:scale(1.05);
}

.pdf-btn{

    background:#dc2626;

    color:white;
}

.pdf-btn:hover{

    background:#b91c1c;

    transform:scale(1.05);
}

.import-btn{

    background-color: rgb(208, 189, 20);
    color:white;
}

.import-btn:hover{

    background:greenyellow;

    transform:scale(1.05);
}

.import-section{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:15px;

    flex-wrap:wrap;
}

#importExcel{

    padding:8px;
}
        

    </style>

</head>

<body>

<div class="top-header">

    <div class="logo-area">

        <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png"
            alt="Logo"
        >

        <div>

            <h1>Student Management System</h1>

            <p>
                Manage Students & Results
            </p>

        </div>

    </div>

    <button onclick="logout()" class="logout-btn">
        Logout
    </button>

</div>

<div class="form-container">

   

    <input id="name" type="text" placeholder="Enter Name">

    <input id="password" type="password" placeholder="Enter Password">

    <input id="age" type="number" placeholder="Enter Age">

    <input id="regNo" type="text" placeholder="Enter Register Number">

    <input id="tamil" type="number" placeholder="Tamil Mark">

    <input id="english" type="number" placeholder="English Mark">

    <input id="maths" type="number" placeholder="Maths Mark">

    <input id="science" type="number" placeholder="Science Mark">

    <input id="social" type="number" placeholder="Social Mark">

    <select id="gender">

        

    <button class="add-btn" onclick="addStudent()">
        Add Student
    </button>

</div>
        <option value="">Select Gender</option>

        <option value="Male">Male</option>

        <option value="Female">Female</option>

    </select>

    <button class="add-btn" onclick="addStudent()">
        Add Student
    </button>

</div>

<input
    type="text"
    id="searchInput"
    placeholder="Search Student"
    onkeyup="searchStudent()"
/>

<h2>Students List</h2>

<div id="messageBox"></div>

<div id="studentsList"></div>
<div class="file-section">

    <h2>Reports & Excel Operations</h2>

    <div class="button-group">

        <button class="export-btn" onclick="exportExcel()">
            Export Excel
        </button>

        <button class="pdf-btn" onclick="exportPdf()">
            Export PDF
        </button>

    </div>

    <div class="import-section">

        <input type="file" id="excelFile">

        <button class="import-btn" onclick="importExcel()">
            Import Excel
        </button>

    </div>


   


<script>

let allStudents = [];

async function addStudent() {

    const student = {

        name: document.getElementById("name").value,
        regNo: document.getElementById("regNo").value, 
        age: document.getElementById("age").value,
        password: document.getElementById("password").value,

        gender: document.getElementById("gender").value,
        tamil: document.getElementById("tamil").value,

english: document.getElementById("english").value,

maths: document.getElementById("maths").value,

science: document.getElementById("science").value,

social: document.getElementById("social").value

};
    

    await fetch("http://localhost:8080/add", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(student)
    });

    document.getElementById("messageBox").innerHTML =
    "Student Added Successfully";

    document.getElementById("messageBox").style.backgroundColor =
    "green";

    loadStudents();

    document.getElementById("name").value = "";
    document.getElementById("age").value = "";
    document.getElementById("gender").value = "";
    document.getElementById("name").value = "";

document.getElementById("password").value = "";

document.getElementById("age").value = "";

document.getElementById("regNo").value = "";

document.getElementById("gender").value = "";

document.getElementById("tamil").value = "";

document.getElementById("english").value = "";

document.getElementById("maths").value = "";

document.getElementById("science").value = "";

document.getElementById("social").value = "";
}

async function loadStudents() {

    const response =
    await fetch("http://localhost:8080/students");

    allStudents = await response.json();

    displayStudents(allStudents);
}

function displayStudents(students) {

    let output = "";

    students.forEach(student => {

        output += `

        <div class="student-card" id="student-${student.id}">

            <input
                type="text"
                value="${student.name}"
                disabled
            >

            <input
                type="number"
                value="${student.age}"
                disabled
            >

            <select disabled>

                <option value="Male"
                    ${student.gender === "Male" ? "selected" : ""}>
                    Male
                </option>

                <option value="Female"
                    ${student.gender === "Female" ? "selected" : ""}>
                    Female
                </option>

            </select>

            <button class="update-btn"
                onclick="editStudent(${student.id})">
                Edit
            </button>

        </div>
        `;
    });

    document.getElementById("studentsList").innerHTML =
    output;
}

function editStudent(id){

    const student =
    allStudents.find(s => s.id === id);

    const studentCard =
    document.getElementById("student-" + id);

    studentCard.innerHTML = `

        <input type="text"
            id="editName${id}"
            value="${student.name}">

        <input type="number"
            id="editAge${id}"
            value="${student.age}">

        <select id="editGender${id}">

            <option value="Male"
                ${student.gender === "Male" ? "selected" : ""}>
                Male
            </option>

            <option value="Female"
                ${student.gender === "Female" ? "selected" : ""}>
                Female
            </option>

        </select>

        <button class="save-btn"
            onclick="saveStudent(${id})">
            Save
        </button>

        <button class="delete-btn"
            onclick="deleteStudent(${id})">
            Delete
        </button>
    `;
}

async function saveStudent(id){

    const updatedStudent = {

        name:
        document.getElementById("editName" + id).value,

        age:
        document.getElementById("editAge" + id).value,

        gender:
        document.getElementById("editGender" + id).value
    };

    await fetch(`http://localhost:8080/update/${id}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(updatedStudent)
    });

    document.getElementById("messageBox").innerHTML =
    "Student Updated";

    document.getElementById("messageBox").style.backgroundColor =
    "blue";

    loadStudents();
}
async function deleteStudent(id){

    await fetch(
        `http://localhost:8080/delete/${id}`,
        {
            method: "DELETE"
        }
    );

    document.getElementById("messageBox").innerHTML =
    "Student Deleted Successfully";

    document.getElementById("messageBox").style.backgroundColor =
    "red";

    loadStudents();
}

function exportExcel(){

    window.location.href =
    "http://localhost:8080/export/excel";
}

function exportPdf(){

    window.location.href =
    "http://localhost:8080/export/pdf";
}

loadStudents();
async function importExcel(){

    const fileInput =
    document.getElementById("excelFile");

    const file =
    fileInput.files[0];

    const formData =
    new FormData();

    formData.append("file", file);

    await fetch(
        "http://localhost:8080/import/excel",
        {
            method: "POST",
            body: formData
        }
    );

    alert("Excel Imported Successfully");

    loadStudents();
}
function logout(){

    window.location.href = "login.html";
}

</script>
</body>

</html>
